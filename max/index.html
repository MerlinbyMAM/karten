<head>

<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Ois Guade, Max!</title>
<style>
html,body{margin:0;height:100%;background:#120c05;color:#fff8e7;font-family:Georgia,'Times New Roman',serif;overflow:hidden;touch-action:none;-webkit-user-select:none;user-select:none}
#ar{position:fixed;inset:0}
.screen{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:24px;box-sizing:border-box;background:radial-gradient(circle at 50% 35%,#4a3414,#120c05 75%);z-index:10}
h1{font-size:2.3em;color:#f2c94c;margin:.1em 0;text-shadow:0 3px 8px #000}
h2{font-size:1.2em;margin:.2em 0 1em;font-weight:normal}
button{font:inherit;font-size:1.15em;margin:8px;padding:14px 28px;border-radius:32px;border:2px solid #f2c94c;background:#1d4f9c;color:#fff;box-shadow:0 4px 14px #0009}
button.alt{background:transparent;font-size:.95em;padding:10px 20px}
.small{opacity:.85;font-size:.95em;max-width:420px;line-height:1.4}
.raute{width:180px;height:14px;margin:10px auto;background:repeating-linear-gradient(45deg,#1d6fd0 0 10px,#fff 10px 20px);border-radius:3px}
.bar{width:240px;height:10px;background:#0007;border-radius:5px;overflow:hidden;margin-top:14px}
.bar div{height:100%;width:0;background:#f2c94c;transition:width .2s}
#hint{position:fixed;bottom:28px;left:12px;right:12px;text-align:center;z-index:6;font-size:1.15em;text-shadow:0 2px 5px #000;pointer-events:none;display:none;background:#0008;padding:10px;border-radius:14px}
#game.flat{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);height:min(100vh,150vw);width:auto;aspect-ratio:2/3;z-index:4;box-shadow:0 0 30px #000}
#game{display:none}
#game.flat{display:block}
</style>

const game = document.getElementById('game');
const g = game.getContext('2d');

const $ = id => document.getElementById(id);

/* ---------- Ton ----------
   Alles läuft über EINEN Audio-Kanal (Web Audio), der die ganze Zeit offen bleibt.
   Keine Sprachausgabe des Handys mehr: die ist auf dem iPhone unzuverlässig, kommt verspätet
   (z. B. mitten in der nächsten Runde) und schaltet dabei den Spielton ab.
   Jeder Ton wird gemerkt, damit bei einer neuen Runde alles Alte sofort gestoppt wird. */
let ac = null;
let activeNodes = [];
function audioInit(){
  try{ ac = ac || new (window.AudioContext||window.webkitAudioContext)(); if(ac.state!=='running') ac.resume(); }catch(e){}
  if(!voiceBuf && !voiceTried) loadVoice();
}
function track(node){
  activeNodes.push(node);
  node.onended = () => { activeNodes = activeNodes.filter(n => n !== node); };
}
function stopAllSound(){
  for(const n of activeNodes){ try{ n.onended = null; n.stop(); }catch(e){} }
  activeNodes = [];
}
function tone(f, t0, dur, type='triangle', vol=.18){
  if(!ac) return;
  const o = ac.createOscillator(), v = ac.createGain();
  o.type = type; o.frequency.value = f;
  v.gain.setValueAtTime(0, ac.currentTime+t0);
  v.gain.linearRampToValueAtTime(vol, ac.currentTime+t0+.02);
  v.gain.exponentialRampToValueAtTime(.001, ac.currentTime+t0+dur);
  o.connect(v); v.connect(ac.destination);
  o.start(ac.currentTime+t0); o.stop(ac.currentTime+t0+dur+.05);
  track(o);
}
const sfxGood = (big) => { tone(660,0,.12); tone(big?1320:990,.08,.18); };
const sfxBad = () => { tone(140,0,.35,'square',.12); };
function birthdaySong(){
  // Happy Birthday (gemeinfrei)
  const N = {G4:392,A4:440,B4:493.9,C5:523.3,D5:587.3,E5:659.3,F5:698.5,G5:784};
  const s = [['G4',.75],['G4',.25],['A4',1],['G4',1],['C5',1],['B4',2],
             ['G4',.75],['G4',.25],['A4',1],['G4',1],['D5',1],['C5',2],
             ['G4',.75],['G4',.25],['G5',1],['E5',1],['C5',1],['B4',1],['A4',2],
             ['F5',.75],['F5',.25],['E5',1],['C5',1],['D5',1],['C5',2.5]];
  let t = .1; const b = .33;
  for(const [n,d] of s){ tone(N[n], t, d*b*1.1, 'triangle', .16); tone(N[n]/2, t, d*b*1.1, 'sine', .08); t += d*b; }
  return t;
}
// Optionale Sprachaufnahme (stimme.m4a neben index.html), läuft im selben Audio-Kanal
let voiceBuf = null, voiceTried = false;
async function loadVoice(){
  voiceTried = true;
  try{
    const r = await fetch('stimme.m4a', {cache:'no-cache'});
    if(r.ok && ac) voiceBuf = await ac.decodeAudioData(await r.arrayBuffer());
  }catch(e){}
}
function playVoiceAt(t0){
  if(!voiceBuf || !ac) return;
  const s = ac.createBufferSource(); s.buffer = voiceBuf; s.connect(ac.destination);
  s.start(ac.currentTime + t0); track(s);
}

/* ---------- Spiel ---------- */
const GAME_TIME = (location.hash==='#kurztest')?3:30;
let mode = 'ar', state = 'ready', visible = false;
let score = 0, timeLeft = GAME_TIME, items = [], popups = [], confetti = [];
let mugX = W/2, targetX = W/2, spawnT = 0, last = performance.now(), wobble = 0;
const KINDS = [
  {e:'🥨', p:1,  w:30},
  {e:'🍺', p:2,  w:22},
  {e:'❤', p:3,  w:10, heart:true},
  {e:'💧', p:-2, w:16, txt:'Wasser?! Pfui!'},
];
function pick(){ const tot = KINDS.reduce((a,k)=>a+k.w,0); let r = Math.random()*tot; for(const k of KINDS){ if((r-=k.w)<0) return k; } return KINDS[0]; }

function reset(){ score=0; timeLeft=GAME_TIME; items=[]; popups=[]; confetti=[]; spawnT=0; state='play'; }

function setTargetFromEvent(ev){
  const p = ev.touches ? ev.touches[0] : ev;
  if(!p) return;
  if(mode==='flat'){ const r = game.getBoundingClientRect(); targetX = (p.clientX - r.left)/r.width*W; }
  else targetX = p.clientX/innerWidth*W;
  targetX = Math.max(60, Math.min(W-60, targetX));
}
addEventListener('pointermove', setTargetFromEvent, {passive:true});
addEventListener('touchmove', setTargetFromEvent, {passive:true});
// iPhone erlaubt das Einschalten von Ton nur bei "Finger loslassen"/Klick, NICHT beim Aufsetzen (pointerdown).
// Deshalb wird der Ton hier – beim Loslassen – bei Bedarf komplett neu gestartet.
function unlockAudio(){
  if(!ac) return;
  if(ac.state !== 'running'){ try{ ac.resume(); }catch(e){} }
}
addEventListener('touchend', unlockAudio, {passive:true});
addEventListener('click', unlockAudio);
addEventListener('pointerdown', ev => {
  // Kamera-Start unterbricht auf dem iPhone oft den Ton -> bei jedem Tippen wieder einschalten
  if(ac && ac.state!=='running'){ try{ ac.resume(); }catch(e){} }
  setTargetFromEvent(ev);
  if($('start').style.display !== 'none' || $('loading').style.display !== 'none') return;
  if(mode==='ar' && !visible) return;
  if(state==='ready') reset();
  else if(state==='end' && performance.now()-endAt > 1500){
    // neue Runde: Sprachausgabe stoppen und den Ton frisch starten.
    // Nach der Stimme hängt der iPhone-Ton sonst im Zustand "unterbrochen" fest.
    stopAllSound();        // Lied/Stimme der alten Runde sofort beenden
    reset();
  }
});

let endAt = 0;
function finish(){
  state = 'end'; endAt = performance.now();
  for(let i=0;i<160;i++) confetti.push({x:Math.random()*W, y:-Math.random()*H*.6, vx:(Math.random()-.5)*60, vy:80+Math.random()*120, r:Math.random()*6.28, c:['#1d6fd0','#ffffff','#f2c94c','#c0392b'][i%4]});
  const t = birthdaySong();
  playVoiceAt(t + .3);
}

function update(dt){
  wobble += dt;
  mugX += (targetX - mugX) * Math.min(1, dt*12);
  for(const c of confetti){ c.x += c.vx*dt; c.y += c.vy*dt; c.r += dt*4; if(c.y>H+20){ c.y=-10; } }
  popups.forEach(p=>{ p.y -= 40*dt; p.t -= dt; }); popups = popups.filter(p=>p.t>0);
  if(state!=='play') return;
  timeLeft -= dt;
  if(timeLeft <= 0){ timeLeft = 0; finish(); return; }
  spawnT -= dt;
  const speedUp = 1 + (GAME_TIME-timeLeft)/GAME_TIME*1.2;
  if(spawnT <= 0){ spawnT = .75/speedUp; const k = pick(); items.push({k, x:50+Math.random()*(W-100), y:150, v:(170+Math.random()*80)*speedUp, rot:(Math.random()-.5)*2, a:0}); }
  const mugTop = H-215;
  for(const it of items){
    it.y += it.v*dt; it.a += it.rot*dt;
    if(!it.done && it.y > mugTop && it.y < mugTop+60 && Math.abs(it.x-mugX) < 72){
      it.done = true; score = Math.max(0, score + it.k.p);
      popups.push({x:it.x, y:mugTop-20, t:1, s:(it.k.p>0?'+':'')+it.k.p + (it.k.txt? '  '+it.k.txt : ''), bad:it.k.p<0});
      it.k.p>0 ? sfxGood(it.k.p>=3) : sfxBad();
    }
  }
  items = items.filter(it => !it.done && it.y < H+60);
}

function rr(x,y,w,h,r){ g.beginPath(); g.moveTo(x+r,y); g.arcTo(x+w,y,x+w,y+h,r); g.arcTo(x+w,y+h,x,y+h,r); g.arcTo(x,y+h,x,y,r); g.arcTo(x,y,x+w,y,r); g.closePath(); }
function heart(x,y,s){
  g.save(); g.translate(x,y); g.scale(s,s);
  g.beginPath(); g.moveTo(0,12); g.bezierCurveTo(-30,-10,-18,-34,0,-18); g.bezierCurveTo(18,-34,30,-10,0,12); g.closePath();
  g.fillStyle='#8a4b1f'; g.fill(); g.lineWidth=3; g.setLineDash([2,4]); g.strokeStyle='#fff'; g.stroke(); g.setLineDash([]);
  g.fillStyle='#e85a8a'; g.font='bold 9px Georgia'; g.textAlign='center'; g.fillText('Max',0,-6);
  g.restore();
}
function mug(x,y){
  g.save(); g.translate(x,y);
  // Henkel
  g.lineWidth=12; g.strokeStyle='#cfd6dc'; g.beginPath(); g.arc(58,40,26,-Math.PI/2,Math.PI/2); g.stroke();
  // Glas
  rr(-52,0,104,105,12); g.fillStyle='rgba(242,170,40,.95)'; g.fill();
  g.lineWidth=4; g.strokeStyle='#fff8'; g.stroke();
  for(let i=-36;i<=36;i+=24){ g.fillStyle='#fff3'; rr(i-5,12,10,80,5); g.fill(); }
  // Schaum
  g.fillStyle='#fffdf5';
  for(let i=-48;i<=48;i+=19){ g.beginPath(); g.arc(i, 2+Math.sin(wobble*6+i)*2, 15, 0, 6.29); g.fill(); }
  g.restore();
}

function draw(){
  g.clearRect(0,0,W,H);
  if(mode==='flat'){ if(cardImg.complete) g.drawImage(cardImg,0,0,W,H); }
  // leichter Schleier, damit das Spiel gut lesbar ist
  g.fillStyle = state==='play' ? 'rgba(15,25,60,.38)' : 'rgba(15,25,60,.6)';
  g.fillRect(0,0,W,H);
  g.textAlign='center'; g.textBaseline='middle';

  if(state==='ready'){
    g.fillStyle='#f2c94c'; g.font='bold 54px Georgia'; g.fillText('Servus Max!',W/2,190);
    g.fillStyle='#fff'; g.font='30px Georgia';
    g.fillText('Fang mit deinem Maßkrug',W/2,300);
    g.fillText('Brezn 🥨 Bier 🍺 und Herzerl ❤',W/2,345);
    g.fillText('aber koa Wasser 💧!',W/2,390);
    g.font='26px Georgia'; g.fillText('Finger links/rechts wischen',W/2,470);
    g.fillStyle='#f2c94c'; g.font='bold 40px Georgia';
    g.fillText(Math.sin(wobble*4)>-.3 ? '👆 Tippen zum Start' : '', W/2, 580);
    mug(mugX, H-215);
    return;
  }

  for(const it of items){
    g.save(); g.translate(it.x,it.y); g.rotate(it.a);
    if(it.k.heart) heart(0,0,1.6); else { g.font='58px serif'; g.fillText(it.k.e,0,0); }
    g.restore();
  }
  mug(mugX, H-215);
  for(const p of popups){ g.globalAlpha=Math.max(0,p.t); g.fillStyle=p.bad?'#ff6b6b':'#f2c94c'; g.font='bold 34px Georgia'; g.fillText(p.s,Math.min(W-150,Math.max(150,p.x)),p.y); g.globalAlpha=1; }

  // Anzeige oben
  g.fillStyle='rgba(0,0,0,.45)'; rr(20,20,W-40,64,18); g.fill();
  g.fillStyle='#fff'; g.font='bold 32px Georgia'; g.textAlign='left'; g.fillText('🍺 '+score,44,53);
  g.textAlign='right'; g.fillText('⏱ '+Math.ceil(timeLeft)+' s',W-44,53); g.textAlign='center';

  if(state==='end'){
    g.fillStyle='rgba(10,20,50,.55)'; g.fillRect(0,0,W,H);
    for(const c of confetti){ g.save(); g.translate(c.x,c.y); g.rotate(c.r); g.fillStyle=c.c; g.fillRect(-6,-3,12,6); g.restore(); }
    const pulse = 1 + Math.sin(wobble*5)*.04;
    g.save(); g.translate(W/2,250); g.scale(pulse,pulse);
    g.fillStyle='#f2c94c'; g.font='bold 66px Georgia'; g.fillText('Ois Guade,',0,-40); g.fillText('Max!',0,40);
    g.restore();
    g.fillStyle='#fff'; g.font='34px Georgia'; g.fillText('zum Geburtstag 🎉',W/2,370);
    g.font='bold 44px Georgia'; g.fillText(score+' Punkte – Prost! 🍻',W/2,470);
    g.font='26px Georgia'; g.fillText(score>=40?'Wiesn-Profi! 🏆': score>=20?'Respekt, a echter Münchner!':'Do geht no wos! 😉', W/2, 535);
    if(performance.now()-endAt>1500){ g.fillStyle='#f2c94c'; g.font='28px Georgia'; g.fillText('Tippen für noch a Runde', W/2, 640); }
  }
}

function loop(now){
  const dt = Math.min(.05, (now-last)/1000); last = now;
  if(mode==='flat' || visible) update(dt); else wobble += dt;
  draw();
  if(tex) tex.needsUpdate = true;
  requestAnimationFrame(loop);
}
let tex = null;

/* ---------- Start ---------- */
function showFlat(msg){
  mode = 'flat'; $('start').style.display='none'; $('loading').style.display='none'; $('hint').style.display='none';
  game.classList.add('flat');
  if(msg){ const h=$('hint'); h.textContent=msg; h.style.display='block'; setTimeout(()=>h.style.display='none',5000); }
}
$('btnFlat').onclick = () => { audioInit(); showFlat(); };
$('btnAR').onclick = async () => {
  audioInit();
  $('start').style.display='none'; $('loading').style.display='flex';
  const bar = $('loadBar'), txt = $('loadText');
  try{
    if(!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) throw new Error('nocam');
    let url = null;
    // 1. vorab gelernte Karte laden (schnell)
    try{
      txt.textContent = 'Karte wird geladen …'; bar.style.width = '30%';
      const r = await fetch('targets.mind', {cache:'no-cache'});
      if(r.ok) url = URL.createObjectURL(new Blob([await r.arrayBuffer()]));
    }catch(e){ console.warn('targets.mind', e); }
    // 2. Notfall: Karte im Browser lernen (langsam)
    if(!url){
      await cardImg.decode().catch(()=>{});
      txt.textContent = 'Lerne deine Karte kennen …';
      const lib = await import('https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image.prod.js');
      const Compiler = lib.Compiler || (window.MINDAR && window.MINDAR.IMAGE && window.MINDAR.IMAGE.Compiler);
      const compiler = new Compiler();
      await compiler.compileImageTargets([cardImg], p => { bar.style.width = Math.round(p*0.8)+'%'; });
      url = URL.createObjectURL(new Blob([await compiler.exportData()]));
    }
    txt.textContent = 'Kamera wird gestartet …'; bar.style.width='90%';
    const THREE = await import('three');
    const { MindARThree } = await import('mindar-image-three');
    const mind = new MindARThree({ container: $('ar'), imageTargetSrc: url, uiScanning:'no', uiLoading:'no', uiError:'no', filterMinCF:0.0001, filterBeta:0.001 });
    const { renderer, scene, camera } = mind;
    const anchor = mind.addAnchor(0);
    tex = new THREE.CanvasTexture(game);
    tex.colorSpace = THREE.SRGBColorSpace;
    const mesh = new THREE.Mesh(new THREE.PlaneGeometry(1, H/W), new THREE.MeshBasicMaterial({ map: tex, transparent: true }));
    anchor.group.add(mesh);
    anchor.onTargetFound = () => { visible = true; $('hint').style.display='none'; };
    anchor.onTargetLost  = () => { visible = false; $('hint').textContent='📷 Karte wieder ins Bild halten'; $('hint').style.display='block'; };
    await mind.start();
    renderer.setAnimationLoop(() => renderer.render(scene, camera));
    $('loading').style.display='none'; $('hint').style.display='block';
  }catch(e){
    console.error(e);
    showFlat('Kamera klappt hier nicht – dann halt ohne. Viel Spaß! 🍺');
  }
};
requestAnimationFrame(loop);
</script>
</body>
</html>
