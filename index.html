<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Lebendige Karten – die Kollektion</title>
<style>
:root{--ink:#2b1d16;--gold:#b8862e;--paper:#fbf6ee}
*{box-sizing:border-box}
body{margin:0;font-family:Georgia,'Times New Roman',serif;background:var(--paper);color:var(--ink)}
header{padding:48px 20px 24px;text-align:center}
header h1{font-size:2.4em;margin:.1em 0;font-style:italic;color:var(--gold)}
header p{max-width:620px;margin:.6em auto;line-height:1.5}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:22px;max-width:1180px;margin:0 auto;padding:10px 20px 50px}
.card{background:#fff;border-radius:14px;box-shadow:0 6px 18px #0002;overflow:hidden;display:flex;flex-direction:column}
.card img{width:100%;aspect-ratio:2/3;object-fit:cover;display:block;background:#eee}
.card .b{padding:14px 16px 16px;display:flex;flex-direction:column;gap:6px;flex:1}
.card h2{margin:0;font-size:1.15em}
.card .t{font-size:.82em;color:#7a6250;text-transform:uppercase;letter-spacing:.06em}
.card p{margin:0;font-size:.92em;line-height:1.4;flex:1}
.btns{display:flex;flex-wrap:wrap;gap:8px;margin-top:6px}
.card a,.card button,.dlg button,.dlg a.btn{font:inherit;cursor:pointer;padding:8px 16px;border-radius:20px;background:var(--gold);color:#fff;text-decoration:none;font-size:.9em;border:1px solid var(--gold)}
.card .alt,.dlg .alt{background:transparent;color:var(--gold)}
footer{text-align:center;padding:30px 20px 50px;font-size:.85em;color:#7a6250}
/* Personalisieren */
.dlg{position:fixed;inset:0;background:#0008;display:none;align-items:flex-start;justify-content:center;z-index:20;overflow:auto;padding:18px}
.dlg.on{display:flex}
.box{background:#fff;border-radius:16px;max-width:760px;width:100%;padding:20px 22px;display:grid;grid-template-columns:1fr 1fr;gap:20px;box-shadow:0 10px 40px #0006;position:relative}
.box h3{grid-column:1/-1;margin:0;font-size:1.4em;color:var(--gold);font-style:italic}
.box label{display:block;font-size:.85em;color:#7a6250;margin:10px 0 3px}
.box input,.box textarea{width:100%;font:inherit;padding:9px 11px;border:1px solid #d8c8b4;border-radius:10px;background:#fffdf9}
.box textarea{min-height:64px;resize:vertical}
.prev{display:flex;flex-direction:column;align-items:center;gap:10px}
.prev canvas{width:100%;max-width:300px;border-radius:10px;box-shadow:0 4px 14px #0003}
.link{font-size:.75em;word-break:break-all;color:#7a6250;background:#f6efe4;padding:8px 10px;border-radius:8px;width:100%}
.x{position:absolute;top:8px;right:12px;background:none!important;border:none!important;color:#7a6250!important;font-size:1.6em!important;padding:0 6px!important}
.hint{font-size:.8em;color:#7a6250;line-height:1.4}
.lsel{position:absolute;top:14px;right:18px;font-size:.85em;color:#7a6250}
.lsel select,.box select{font:inherit;padding:6px 8px;border:1px solid #d8c8b4;border-radius:8px;background:#fffdf9}
.box select{width:100%}
header{position:relative}
@media (max-width:640px){.box{grid-template-columns:1fr}}
</style>
</head>
<body>
<header>
  <div class="lsel"><label for="ls" id="lsl"></label> <select id="ls"></select></div>
  <h1 id="th1"></h1>
  <p id="tin"></p>
</header>
<div class="grid" id="g"></div>
<footer id="tft"></footer>

<div class="dlg" id="dlg"><div class="box">
  <button class="x" id="dx" aria-label="Schließen">×</button>
  <h3 id="dt"></h3>
  <div>
    <label for="cl" id="lcl"></label><select id="cl"></select>
    <label for="n1" id="ln1"></label><input id="n1" maxlength="24">
    <label for="n2" id="ln2"></label><input id="n2" maxlength="24">
    <div id="ex"></div>
    <p class="hint" id="thint"></p>
  </div>
  <div class="prev">
    <canvas id="pv" width="576" height="864"></canvas>
    <div class="link" id="lk"></div>
    <div class="btns">
      <a class="btn" id="open" target="_blank"></a>
      <button id="pdf"></button>
      <button class="alt" id="cp"></button>
    </div>
    <p class="hint" id="st"></p>
  </div>
</div></div>

<script src="https://cdn.jsdelivr.net/npm/qrcode-generator@1.4.4/qrcode.js"></script>
<script src="katalog_text.js"></script>
<script>
const BASE = location.href.replace(/[#?].*$/, '').replace(/index\.html$/, '').replace(/\/?$/, '/');
const both = (a, b) => a && b ? a + ' & ' + b : (a || b || '');
// [Ordner, Beispiel, Zusatzfelder [Parameter, Text-Schlüssel, mehrzeilig], Parameter aus Eingaben, QR-Position]
const K = [
 ['kaetzchen', '?name=Anna', [], v => ({ name: v.N })],
 ['max', '?name=Max&datum=7.11.2026', [['datum','datumMax']], v => ({ name: v.N, datum: v.datum }), [.5, .375]],
 ['torte', '?name=Anna', [], v => ({ name: v.N })],
 ['ballons', '?name=Paul', [], v => ({ name: v.N })],
 ['rubbellos', '?name=Anna&text2=Ein%20Wellness-Wochenende!', [['text2','text2']], v => ({ name: v.N, text2: v.text2 })],
 ['weihnacht', '?name=Familie%20M%C3%BCller', [], v => ({ name: v.N })],
 ['liebe', '?text=Ich%20liebe%20dich!&von=Max', [['nachricht','nachricht',1],['von','von']], v => v.nachricht ? { text: (v.N ? v.N + ', ' : '') + v.nachricht, von: v.von } : { name: v.N, von: v.von }],
 ['baby', '?name=Lena&datum=3.%20M%C3%A4rz%202026&gewicht=3250%20g', [['datum','geburt'],['gewicht','gewicht'],['groesse','groesse']], v => ({ name: v.N, datum: v.datum, gewicht: v.gewicht, groesse: v.groesse })],
 ['feuerwerk', '?name=Anna%20%26%20Tom', [['gruss','gruss']], v => { const gr = (v.gruss || '').replace(/[\s!.,;:]+$/, ''); return gr ? { text: gr + (v.N ? ', ' + v.N : '') + '!' } : { name: v.N }; }],
 ['weltraum', '?name=Leo', [], v => ({ name: v.N })],
 ['blume', '?text=Danke%20f%C3%BCr%20alles!&von=Deine%20Tochter', [['nachricht','nachricht',1],['von','von']], v => v.nachricht ? { text: (v.N ? v.N + ', ' : '') + v.nachricht, von: v.von } : { name: v.N, von: v.von }, [.84, .975]],
 ['gluecksrad', '?preise=Kino|Pizza|Massage|Ausflug|Fr%C3%BChst%C3%BCck|Wunsch%20frei', [['preise','preise']], v => ({ name: v.N, preise: v.preise })],
 ['zeitung', '?name=Oma%20Gerda', [['meldung','meldung',1]], v => ({ name: v.N, text: v.meldung }), [.82, .965]],
 ['hochzeit', '?namen=Anna%20%26%20Tom&datum=12.%20Juni%202026', [['datum','datum']], v => ({ namen: v.N, datum: v.datum })],
 ['rennen', '?firma=Muster%20Fuhrpark%20GmbH', [['firma','firma']], v => ({ firma: v.firma }), [.15, .2]],   // nur QR-Sticker für eine vorhandene Karte
];
const $ = id => document.getElementById(id);
const LS = Object.keys(CT);
let UL = new URLSearchParams(location.search).get('lang');
if(!CT[UL]){ UL = 'en'; for(const l of (navigator.languages || [navigator.language])){ const k = String(l).slice(0, 2).toLowerCase(); if(CT[k]){ UL = k; break; } } }
const T = () => CT[UL];
function drawUI(){
  document.documentElement.lang = UL;
  $('ls').innerHTML = LS.map(l => `<option value="${l}"${l === UL ? ' selected' : ''}>${CT[l].name}</option>`).join('');
  $('lsl').textContent = T().lang; $('th1').textContent = T().h1; $('tin').textContent = T().intro; $('tft').textContent = T().footer;
  $('lcl').textContent = T().cardLang; $('ln1').textContent = T().n1; $('ln2').textContent = T().n2; $('n1').placeholder = T().p1; $('n2').placeholder = T().p2;
  $('thint').textContent = T().hint; $('open').textContent = T().view; $('pdf').textContent = T().pdf; $('cp').textContent = T().copy;
  $('cl').innerHTML = LS.map(l => `<option value="${l}">${CT[l].name}</option>`).join('');
  $('g').innerHTML = K.map(([d, q], i) => { const [t, h, p] = T().CARDS[d];
    return `<div class="card"><img loading="lazy" src="${d}/karte${UL === 'de' ? '' : '_' + UL}.jpg" onerror="this.onerror=null;this.src='${d}/karte.jpg'" alt="${h}">
 <div class="b"><div class="t">${t}</div><h2>${h}</h2><p>${p}</p>
 <div class="btns"><a href="${d}/?lang=${UL}">${T().open}</a><button onclick="openP(${i})">${T().pers}</button>
 <a class="alt" href="${d}/${q}&lang=${UL}">${T().ex}</a></div></div></div>`; }).join('');
}
$('ls').onchange = () => { UL = $('ls').value; history.replaceState(null, '', '?lang=' + UL); drawUI(); };
drawUI();

/* ---------- Personalisieren ---------- */
let cur = null, baseImg = null;
const cache = {};
async function loadBase(d, lang){
  const key = d + '_' + lang;
  if(cache[key]) return cache[key];
  let blob;
  const pdfUrl = async () => { if(lang !== 'de'){ const u = `druck/${lang}/Karte_${d}_13x18.pdf`; try{ if((await fetch(u, {method: 'HEAD'})).ok) return u; }catch(e){} } return `druck/Karte_${d}_13x18.pdf`; };
  try{                                           // Druckbild (hohe Auflösung) aus dem Druck-PDF holen – in der Sprache der Karte, falls vorhanden
    const b = new Uint8Array(await (await fetch(await pdfUrl())).arrayBuffer());
    const txt = new TextDecoder('latin1').decode(b);
    const m = /\/DCTDecode \/Length (\d+) >>\nstream\n/.exec(txt);
    if(!m) throw 0;
    const start = m.index + m[0].length;
    blob = new Blob([b.slice(start, start + +m[1])], {type: 'image/jpeg'});
  }catch(e){ blob = await (await fetch(`${d}/karte.jpg`)).blob(); }
  const im = new Image(); im.src = URL.createObjectURL(blob); await im.decode();
  return cache[key] = im;
}
function values(){
  const v = { N: both($('n1').value.trim(), $('n2').value.trim()) };
  for(const [k] of cur[2]) v[k] = ($('x_' + k).value || '').trim();
  return v;
}
function link(){
  const p = cur[3](values()), q = new URLSearchParams();
  for(const [k, val] of Object.entries(p)) if(val) q.set(k, val);
  q.set('lang', $('cl').value);
  const s = q.toString();
  return BASE + cur[0] + '/' + (s ? '?' + s : '');
}
function rr(g, x, y, w, h, r){ g.beginPath(); g.moveTo(x+r,y); g.arcTo(x+w,y,x+w,y+h,r); g.arcTo(x+w,y+h,x,y+h,r); g.arcTo(x,y+h,x,y,r); g.arcTo(x,y,x+w,y,r); g.closePath(); }
function qrTag(g, text, cx, by, W, H){        // QR-Anhänger wie auf den Karten (Creme, Goldrand)
  const qr = qrcode(0, 'L'); qr.addData(text); qr.make();
  const N = qr.getModuleCount(), tw = Math.round(W*.2), pad = Math.round(tw*.075), mod = (tw - 2*pad)/N;
  const x = Math.round(cx*W - tw/2), y = Math.round(by*H - tw);
  g.save(); g.shadowColor = 'rgba(0,0,0,.25)'; g.shadowBlur = W/115; g.shadowOffsetY = W/380;
  g.fillStyle = '#fffaf0'; rr(g, x, y, tw, tw, tw*.08); g.fill(); g.restore();
  g.strokeStyle = '#c9a24a'; g.lineWidth = W/288; rr(g, x + W/230, y + W/230, tw - W/115, tw - W/115, tw*.065); g.stroke();
  g.fillStyle = '#2b1d16';
  for(let r=0;r<N;r++) for(let c=0;c<N;c++) if(qr.isDark(r, c)) g.fillRect(Math.floor(x+pad+c*mod), Math.floor(y+pad+r*mod), Math.ceil(mod), Math.ceil(mod));
}
function render(cv, url){
  const g = cv.getContext('2d', {willReadFrequently: true}), W = cv.width, H = cv.height;
  g.drawImage(baseImg, 0, 0, W, H);
  if(cur[0] === 'max'){ const v = values(); personalizeMax(g, W/600, v.N || 'Max', v.datum); }
  const [cx, by] = cur[4] || [.5, .975];
  qrTag(g, url, cx, by, W, H);
}
function upd(){
  if(!cur || !baseImg) return;
  const url = link();
  $('lk').textContent = url; $('open').href = url;
  render($('pv'), url);
}
async function openP(i){
  cur = K[i]; baseImg = null;
  $('dt').textContent = T().title + T().CARDS[cur[0]][1];
  $('n1').value = ''; $('n2').value = '';
  $('ex').innerHTML = cur[2].map(([k, fk, area]) => { const [l, ph] = T().F[fk]; return `<label for="x_${k}">${l}</label>` + (area ? `<textarea id="x_${k}" maxlength="160" placeholder="${ph}"></textarea>` : `<input id="x_${k}" maxlength="${k === 'preise' ? 120 : 40}" placeholder="${ph}">`); }).join('');
  $('ex').querySelectorAll('input,textarea').forEach(e => e.oninput = upd);
  const st = cur[0] === 'rennen';                // Sticker: keine Namen, Bogen statt Karte
  for(const id of ['n1','n2','ln1','ln2']) $(id).style.display = st ? 'none' : '';
  $('pdf').textContent = st ? T().sheet : T().pdf;
  $('cl').value = UL; $('st').textContent = T().loading;
  $('dlg').classList.add('on');
  baseImg = await loadBase(cur[0], $('cl').value);
  $('st').textContent = '';
  upd(); $('n1').focus();
}
$('n1').oninput = upd; $('n2').oninput = upd;
$('cl').onchange = async () => { $('st').textContent = T().loading; baseImg = await loadBase(cur[0], $('cl').value); $('st').textContent = ''; upd(); };
$('dx').onclick = () => $('dlg').classList.remove('on');
$('dlg').onclick = e => { if(e.target.id === 'dlg') $('dlg').classList.remove('on'); };
$('cp').onclick = async () => { try{ await navigator.clipboard.writeText(link()); $('st').textContent = T().copied; }catch(e){ $('st').textContent = T().nocopy; } };
$('pdf').onclick = async () => {
  $('st').textContent = T().making;
  if(cur[0] === 'rennen') return stickerSheet();
  const cv = document.createElement('canvas'); cv.width = 1152; cv.height = 1728;
  render(cv, link());
  const jpg = await new Promise(r => cv.toBlob(r, 'image/jpeg', .92));
  const pdf = await makePdf(jpg, 1152, 1728);
  const v = values(), nm = (v.N || 'Karte').replace(/ & /g, '_und_').replace(/[^\wäöüÄÖÜß-]+/g, '_');
  const a = document.createElement('a'); a.href = URL.createObjectURL(pdf); a.download = `Karte_${cur[0]}_${$('cl').value}_${nm}_13x18.pdf`;
  document.body.appendChild(a); a.click(); a.remove();
  $('st').textContent = T().done;
};
// Druck-PDF: 130 x 180 mm, Karte 114,67 x 172 mm mittig, JPEG direkt eingebettet
async function makePdf(jpgBlob, iw, ih, page = [130, 180], img = [114.667, 172]){
  const jpg = new Uint8Array(await jpgBlob.arrayBuffer());
  const mm = v => v*72/25.4, PW = mm(page[0]), PH = mm(page[1]), CW = mm(img[0]), CH = mm(img[1]);
  const X = (PW-CW)/2, Y = (PH-CH)/2;
  const content = `q ${CW.toFixed(3)} 0 0 ${CH.toFixed(3)} ${X.toFixed(3)} ${Y.toFixed(3)} cm /Im0 Do Q`;
  const enc = new TextEncoder(); const parts = []; const offs = []; let len = 0;
  const push = p => { const b = typeof p === 'string' ? enc.encode(p) : p; parts.push(b); len += b.length; };
  push('%PDF-1.4\n%\xC7\xEC\n');
  const obj = (n, body) => { offs[n] = len; push(`${n} 0 obj\n${body}\nendobj\n`); };
  obj(1, '<< /Type /Catalog /Pages 2 0 R >>');
  obj(2, '<< /Type /Pages /Kids [3 0 R] /Count 1 >>');
  obj(3, `<< /Type /Page /Parent 2 0 R /MediaBox [0 0 ${PW.toFixed(3)} ${PH.toFixed(3)}] /Resources << /XObject << /Im0 4 0 R >> >> /Contents 5 0 R >>`);
  offs[4] = len; push(`4 0 obj\n<< /Type /XObject /Subtype /Image /Width ${iw} /Height ${ih} /ColorSpace /DeviceRGB /BitsPerComponent 8 /Filter /DCTDecode /Length ${jpg.length} >>\nstream\n`); push(jpg); push('\nendstream\nendobj\n');
  obj(5, `<< /Length ${content.length} >>\nstream\n${content}\nendstream`);
  const xref = len; let x = 'xref\n0 6\n0000000000 65535 f \n'; for(let i=1;i<=5;i++) x += String(offs[i]).padStart(10,'0') + ' 00000 n \n';
  push(x + `trailer\n<< /Size 6 /Root 1 0 R >>\nstartxref\n${xref}\n%%EOF\n`);
  return new Blob(parts, {type: 'application/pdf'});
}
// QR-Sticker-Bogen A4 (300 dpi): 6 x 8 Sticker à 3 x 3 cm, in Originalgröße drucken
async function stickerSheet(){
  const D = 300/25.4, W = Math.round(210*D), H = Math.round(297*D), S = 30*D, cols = 6, rows = 8;
  const cv = document.createElement('canvas'); cv.width = W; cv.height = H; const g = cv.getContext('2d');
  g.fillStyle = '#fff'; g.fillRect(0, 0, W, H);
  const url = link(), qr = qrcode(0, 'M'); qr.addData(url); qr.make(); const N = qr.getModuleCount();
  const gx = (W - cols*S)/(cols + 1), gy = (H - rows*S - 12*D)/(rows + 1);
  g.fillStyle = '#555'; g.font = `bold ${3*D}px sans-serif`; g.fillText(T().CARDS.rennen[1] + ' · QR 3 × 3 cm · 100 %', 10*D, 8*D);
  for(let r=0;r<rows;r++) for(let k=0;k<cols;k++){
    const x = gx + k*(S + gx), y = 12*D + gy + r*(S + gy);
    g.fillStyle = '#fff'; g.strokeStyle = '#0f3b4f'; g.lineWidth = .25*D; rr(g, x, y, S, S, 2.5*D); g.fill(); g.stroke();
    const q = 23*D, m = q/N, qx = x + (S - q)/2, qy = y + 1.6*D;
    g.fillStyle = '#000'; for(let i=0;i<N;i++) for(let j=0;j<N;j++) if(qr.isDark(i, j)) g.fillRect(Math.floor(qx + j*m), Math.floor(qy + i*m), Math.ceil(m), Math.ceil(m));
    g.fillStyle = '#0f3b4f'; rr(g, x + 2*D, y + S - 4.8*D, S - 4*D, 3.6*D, 1.2*D); g.fill();
    g.fillStyle = '#ffd166'; g.font = `bold ${2.6*D}px sans-serif`; g.textAlign = 'center'; g.textBaseline = 'middle'; g.fillText('SCAN & RACE!', x + S/2, y + S - 3*D); g.textAlign = 'left'; g.textBaseline = 'alphabetic';
  }
  const jpg = await new Promise(r => cv.toBlob(r, 'image/jpeg', .95));
  const pdf = await makePdf(jpg, W, H, [210, 297], [210, 297]);
  const nm = (values().firma || 'Sticker').replace(/[^\wäöüÄÖÜß-]+/g, '_');
  const a = document.createElement('a'); a.href = URL.createObjectURL(pdf); a.download = `QR-Sticker_Rallye_${$('cl').value}_${nm}_3x3cm.pdf`;
  document.body.appendChild(a); a.click(); a.remove();
  $('st').textContent = T().done;
}
function personalizeMax(c, s, name, datum){
  // Lebkuchenherz: alten Namen überdecken, neuen Namen schreiben (Kartenmaße 600 x 900, Faktor s)
  c.save(); c.scale(s, s);
  c.save(); c.filter = 'blur(3px)'; c.fillStyle = '#e0bb86';
  c.beginPath(); c.ellipse(249, 595, 55, 26, 0, 0, 6.283); c.fill(); c.restore();
  c.fillStyle = '#e1bc87'; c.beginPath(); c.ellipse(249, 595, 51, 23, 0, 0, 6.283); c.fill();
  if(name){
    let fs = 40; c.font = `italic bold ${fs}px Georgia`;
    while(c.measureText(name).width > 98 && fs > 12){ fs--; c.font = `italic bold ${fs}px Georgia`; }
    c.textAlign = 'center'; c.textBaseline = 'middle';
    c.lineJoin = 'round'; c.lineWidth = Math.max(2, fs/9); c.strokeStyle = '#fff1e6'; c.strokeText(name, 249, 597);
    c.fillStyle = '#8e2a2a'; c.fillText(name, 249, 597);
  }
  c.restore();
  // Datum unten am Krug entfernen (Zeilen zwischen links und rechts überblenden)
  const x0 = Math.round(146*s), x1 = Math.round(284*s), y0 = Math.round(696*s), y1 = Math.round(728*s);
  const d = c.getImageData(x0, y0, x1 - x0 + 1, y1 - y0 + 1), w = d.width, a = d.data;
  for(let y=0;y<d.height;y++){ const L = y*w*4, R = (y*w + w - 1)*4;
    for(let x=1;x<w-1;x++){ const t = x/(w-1), i = (y*w + x)*4; for(let k=0;k<3;k++) a[i+k] = a[L+k]*(1-t) + a[R+k]*t; } }
  c.putImageData(d, x0, y0);
  if(datum){
    c.save(); c.scale(s, s); c.font = 'bold 24px Georgia'; c.textAlign = 'center'; c.textBaseline = 'middle';
    c.lineWidth = 4; c.strokeStyle = '#3a2410'; c.strokeText(datum, 215, 712); c.fillStyle = '#ecbd55'; c.fillText(datum, 215, 712); c.restore();
  }
}

</script>
</body>
</html>
